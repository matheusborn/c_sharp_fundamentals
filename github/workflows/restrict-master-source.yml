
name: Restrict master PR source

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ] || [ "$SOURCE_REPO" != "$TARGET_REPO" ]; then
            echo "::error::Only PRs from develop in this repository are allowed into master."
            exit 1
          fi
